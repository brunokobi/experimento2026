[project]
name = "hin-empresas"
version = "0.1.0"
description = "Pesquisa academica sobre Grafos Heterogeneos de Empresas (HIN) - construcao de HIN, extracao de metapaths e analise de qualidade estrutural."
authors = [{ name = "Bruno Kobi", email = "bruno.kobi@vennx.com.br" }]
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }

dependencies = [
    "torch>=2.3.0",
    "torch-geometric>=2.5.0",
    "networkx>=3.3",
    "neo4j>=5.20.0",
    "pandas>=2.2.0",
    "pyarrow>=16.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "loguru>=0.7.2",
    "psutil>=5.9.8",
    "python-dotenv>=1.0.1",
    "tqdm>=4.66.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.8",
    "ipykernel>=6.29.0",
    "jupyter>=1.0.0",
    "matplotlib>=3.9.0",
]

# --- UV ---
[tool.uv]
package = true

# --- Poetry (alternativa; manter apenas uma das duas ferramentas em uso) ---
[tool.poetry]
name = "hin-empresas"
version = "0.1.0"
description = "Pesquisa academica sobre Grafos Heterogeneos de Empresas (HIN)"
authors = ["Bruno Kobi <bruno.kobi@vennx.com.br>"]
packages = [{ include = "src" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=src --cov-report=term-missing"
testpaths = ["src/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]
ignore = ["E501"]

[tool.coverage.run]
source = ["src"]
omit = ["src/tests/*"]
